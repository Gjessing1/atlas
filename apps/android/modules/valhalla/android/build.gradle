apply plugin: 'com.android.library'
apply plugin: 'expo-module-gradle-plugin'

group = 'io.gjessing.atlas'
version = '0.1.0'

// Prebuilt libvalhalla + protobuf-lite static libs and headers, cross-compiled
// out-of-band by ~/valhalla-android/build-valhalla.sh (see that workspace's
// build-deps.sh / build-valhalla.sh). Not vendored into the repo — the .a files
// are hundreds of MB across ABIs.
def valhallaDeps = System.getenv('VALHALLA_ANDROID_DEPS') ?: "${System.properties['user.home']}/valhalla-android/deps"

android {
  namespace = 'io.gjessing.atlas.valhalla'

  defaultConfig {
    minSdkVersion 24
    versionCode 1
    versionName '0.1.0'
    ndk {
      // libvalhalla is built for 64-bit only; the app restricts itself to the
      // same ABIs (plugins/withAndroidAbis.js).
      abiFilters 'arm64-v8a', 'x86_64'
    }
    externalNativeBuild {
      cmake {
        arguments "-DVALHALLA_DEPS=${valhallaDeps}", '-DANDROID_STL=c++_shared'
      }
    }
  }

  externalNativeBuild {
    cmake {
      path 'src/main/cpp/CMakeLists.txt'
    }
  }
}
