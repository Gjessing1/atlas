# Deploy from /home/gjessing/docker/atlas (compose + .env live there).
# Persistent data is bind-mounted from the host at /mnt/data/atlas so it survives redeploys.
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: atlas-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      ATLAS_DATA_DIR: /data
    ports:
      # The app defaults to 3100 (3000 is taken by Forgejo on this host).
      - '3100:3100'
    volumes:
      - /mnt/data/atlas:/data
