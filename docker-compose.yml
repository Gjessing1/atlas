# Deploy from /home/gjessing/docker/atlas (compose + .env live there).
# Persistent data is bind-mounted from the host at /mnt/data/atlas so it survives redeploys.
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: atlas-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      ATLAS_DATA_DIR: /data
      # Self-hosted services on the shared external `atlas` docker network.
      PHOTON_URL: http://atlas-photon:2322
      VALHALLA_URL: http://atlas-valhalla:8002
      # Accounts + sync stay off unless both of these are set (see CLAUDE.md).
      # DATABASE_URL: postgres://atlas:<password>@atlas-postgres:5432/atlas
      # JWT_SECRET: <long random string>
      # FROST_CLIENT_ID: <Frost client id; open lightning does not need the secret>
    ports:
      # The app defaults to 3100 (3000 is taken by Forgejo on this host).
      - '3100:3100'
    volumes:
      - type: bind
        source: /mnt/data/atlas
        target: /data
        bind:
          create_host_path: false
    networks:
      - default
      - atlas

networks:
  # Shared with the self-hosted services — photon (infrastructure/photon),
  # valhalla (infrastructure/valhalla) and postgres (infrastructure/postgres),
  # each brought up from its own directory:
  #   docker network create atlas
  atlas:
    external: true
