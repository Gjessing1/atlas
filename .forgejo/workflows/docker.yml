# Builds the Atlas backend image (web app included, served same-origin), pushes it to
# Forgejo's built-in container registry, then redeploys on the host.
#
# Notes specific to this runner (host-Docker-socket model, same as maily/nodemap):
# - `runs-on: docker` -> catthehacker/ubuntu:act-latest, which has the docker CLI.
# - docker build/push run against the HOST daemon via the mounted socket.
# - Pushes go to localhost:3000 (Forgejo's host-published HTTP port) rather than
#   git.gjessing.io, because Caddy 413s large layer uploads. Registry storage is
#   hostname-agnostic, so the image is still *pulled* as git.gjessing.io/... as usual.
# - Auth is a PAT with write:package stored as the REGISTRY_TOKEN repo secret; the
#   automatic GITHUB_TOKEN only gets package *read* on this instance.
name: docker

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  # Public name — what deployments pull (HTTPS via Caddy).
  IMAGE: git.gjessing.io/gjessing1/atlas-backend
  # Push name — straight to Forgejo's host-published port, avoiding Caddy.
  PUSH_IMAGE: localhost:3000/gjessing1/atlas-backend

jobs:
  # Single job: the quality gate (format, lint, types, tests) lives INSIDE the image
  # build (backend/Dockerfile), so a failure means nothing is tagged or pushed.
  # This is the run that decides a deploy, so it runs `npm run test:all` — the local
  # `npm run gate` may skip *.slow.test.ts, this never does.
  #
  # The deploy runs in this job too, rather than in a separate `needs:` job: this
  # instance has ONE runner with capacity 1 shared by every repo, so a second job has
  # to queue for another turn on it. Atlas's own 30-50 minute builds are what usually
  # holds that queue, and if a new commit lands during the wait Forgejo auto-cancels
  # the previous run's still-queued job — the deploy is then silently skipped and a
  # stale container keeps running while the run still shows green.
  build-and-deploy:
    runs-on: docker
    permissions:
      contents: read
      packages: write # not sufficient alone on this instance; push uses REGISTRY_TOKEN (see auth step)
    env:
      DOCKER_BUILDKIT: '1' # required for the Dockerfile's RUN --mount=type=cache npm cache
      # Deploy project (compose file + .env), bind-mounted into the job by the runner.
      DEPLOY_DIR: /home/gjessing/docker/atlas
    steps:
      - uses: actions/checkout@v4

      # Written directly instead of `docker login`: login pings the registry from the job
      # container (where localhost:3000 is unreachable), but the push runs on the host daemon
      # (where it works). Both hostnames are authed here — pushes go to localhost:3000,
      # the deploy's compose pull to git.gjessing.io.
      - name: Registry auth
        run: |
          mkdir -p ~/.docker
          auth=$(printf 'gjessing1:%s' "${{ secrets.REGISTRY_TOKEN }}" | base64 -w0)
          printf '{"auths":{"localhost:3000":{"auth":"%s"},"git.gjessing.io":{"auth":"%s"}}}' \
            "$auth" "$auth" > ~/.docker/config.json

      - name: Build image
        # Tagged with both the public pull name and the localhost push name so the
        # layers are shared (one build, two tag sets).
        run: |
          SHA_TAG="${GITHUB_SHA::7}"
          docker build --progress=plain -f backend/Dockerfile \
            --build-arg GIT_SHA="$GITHUB_SHA" \
            -t "$IMAGE:latest" -t "$IMAGE:$SHA_TAG" \
            -t "$PUSH_IMAGE:latest" -t "$PUSH_IMAGE:$SHA_TAG" .

      # A green quality gate proves the code compiles; it does NOT prove the image
      # RUNS. A runtime dep that isn't shipped (e.g. an @atlas/* dist missing from the
      # image) only surfaces as an import-time crash loop — which is what shipped in
      # v0.75.0. Boot the freshly built image with no sync env (anonymous local-only)
      # and require /api/health before anything is pushed. Poll via `docker exec` (the
      # container runs on the HOST daemon; a host-published port is not reachable from
      # this job container, same as the registry-auth note above), so a crash-exit is
      # caught as an exec failure. Nothing is pushed unless the server actually answers.
      - name: Smoke test — the image must actually boot
        run: |
          SHA_TAG="${GITHUB_SHA::7}"
          cid=$(docker run -d "$IMAGE:$SHA_TAG")
          ok=""
          for i in $(seq 1 30); do
            if docker exec "$cid" node -e "fetch('http://127.0.0.1:3100/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))" 2>/dev/null; then
              ok=1; break
            fi
            sleep 1
          done
          echo "----- container logs -----"; docker logs "$cid" 2>&1 | tail -40 || true
          docker rm -f "$cid" >/dev/null 2>&1 || true
          if [ -z "$ok" ]; then echo "::error::built image failed to serve /api/health"; exit 1; fi
          echo "image booted and served /api/health"

      - name: Push image
        run: |
          SHA_TAG="${GITHUB_SHA::7}"
          docker push "$PUSH_IMAGE:latest"
          docker push "$PUSH_IMAGE:$SHA_TAG"

      # Redeploy on the host, against the host daemon via the mounted Docker socket.
      # Pulls git.gjessing.io/...:latest — the image just pushed above. Guarded on main
      # because this workflow also runs for v* tags and workflow_dispatch.
      - name: Pull and restart
        if: github.ref == 'refs/heads/main'
        run: |
          cd "$DEPLOY_DIR"
          docker compose pull
          docker compose up -d --remove-orphans

      # Fail loudly if the stack came back on the old image, so a lost deploy shows up
      # as a red run instead of a green one with a stale container.
      - name: Verify deploy
        if: github.ref == 'refs/heads/main'
        run: |
          cd "$DEPLOY_DIR"
          built=$(docker image inspect --format '{{.Id}}' "$IMAGE:latest")
          running=$(docker compose ps -q | xargs -r docker inspect --format '{{.Image}}')
          if ! printf '%s\n' "$running" | grep -qFx "$built"; then
            echo "no running container uses the image just built ($built)" >&2
            docker compose ps >&2
            exit 1
          fi
          echo "deployed $built"
