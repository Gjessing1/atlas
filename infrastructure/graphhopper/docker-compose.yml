# GraphHopper routing service (route planning backend). Independent of CI —
# bring it up manually on the host:
#
#   docker network create atlas        # once; shared with the backend container
#   docker compose up -d --build       # from this directory
#
# First start downloads the Norway extract (unless one is already at
# /mnt/data/atlas/graphhopper/norway.osm.pbf — hardlink it from
# planetiler/sources to skip the download) and imports the routing graph,
# which takes hours on the N150; the graph persists in
# /mnt/data/atlas/graphhopper. The backend reaches it as
# http://atlas-graphhopper:8989 over the shared network; 127.0.0.1:8989 is
# published for local dev (npm run dev) and debugging only.
services:
  graphhopper:
    build: .
    container_name: atlas-graphhopper
    restart: unless-stopped
    environment:
      # Serving Norway with 4 LM preparations OOMs at 2g; 4g runs comfortably.
      JAVA_OPTS: -Xmx4g
      JAVA_OPTS_IMPORT: -Xmx5g
    ports:
      - '127.0.0.1:8989:8989'
    volumes:
      - /mnt/data/atlas/graphhopper:/data
    networks:
      - atlas

networks:
  atlas:
    external: true
