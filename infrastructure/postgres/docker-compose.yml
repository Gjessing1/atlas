# PostgreSQL + PostGIS — the sync source of truth (accounts + user-data sync).
# Independent of CI — bring it up manually on the host:
#
#   docker network create atlas        # once; shared with the backend container
#   cp .env.example .env               # set a real POSTGRES_PASSWORD
#   docker compose up -d               # from this directory
#
# The backend reaches it as postgres://atlas:<password>@atlas-postgres:5432/atlas
# over the shared network (set DATABASE_URL and JWT_SECRET in the deploy
# compose .env at /home/gjessing/docker/atlas). 127.0.0.1:5433 is published
# for local dev (npm run dev) and debugging only. The backend creates its own
# schema on startup. Data persists in /mnt/data/atlas/postgres.
services:
  postgres:
    image: postgis/postgis:17-3.5-alpine
    container_name: atlas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: atlas
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - /mnt/data/atlas/postgres:/var/lib/postgresql/data
    networks:
      - atlas

networks:
  atlas:
    external: true
