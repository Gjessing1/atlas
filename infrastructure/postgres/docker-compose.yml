# PostgreSQL + PostGIS — the sync source of truth (accounts + user-data sync).
# Template only: production runs from /home/gjessing/docker/Productivity/atlas/atlas-postgres,
# its own compose project beside the deploy compose. It is kept out of that
# compose so CI's `pull` + `up -d --remove-orphans` on every push never manages
# the one stateful service, and out of this git tree so its secret cannot be lost
# to a clean checkout. There, .env is a symlink to ../.env: one password, shared
# with the backend's DATABASE_URL, and the only variable read from it.
#
# Fresh host:
#   docker network create atlas        # once; shared with the backend container
#   mkdir /home/gjessing/docker/Productivity/atlas/atlas-postgres && cd "$_"
#   cp <repo>/infrastructure/postgres/docker-compose.yml .
#   ln -s ../.env .env                 # POSTGRES_PASSWORD lives in the deploy .env
#   docker compose up -d
#
# The backend reaches it as postgres://atlas:<password>@atlas-postgres:5432/atlas
# over the shared network. 127.0.0.1:5433 is published for local dev
# (npm run dev) and debugging only. The backend creates its own schema on
# startup. Data persists on the system NVMe; Backrest's nightly `atlas` plan
# pg_dumps it by container name.
services:
  postgres:
    image: postgis/postgis:17-3.5-alpine
    container_name: atlas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in ../.env}
      POSTGRES_DB: atlas
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - /home/gjessing/data/atlas/postgres:/var/lib/postgresql/data
    networks:
      - atlas

networks:
  atlas:
    external: true
